<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ALTUS — Private Aviation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,200;0,300;1,200;1,300&family=Montserrat:wght@100;200;300&display=swap" rel="stylesheet">

  <style>
    :root {
      --black:  #080808;
      --amber:  #C4841A;
      --amber-deep: #A86E10;
      --ivory:  #EDE8DF;
      --white:  #F7F4EF;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html { scroll-behavior: auto; }

    body {
      background: var(--black);
      color: var(--ivory);
      font-family: 'Montserrat', sans-serif;
      font-weight: 200;
      overflow-x: hidden;
      cursor: none;
    }

    /* ── Custom cursor ── */
    .cursor {
      position: fixed;
      width: 6px;
      height: 6px;
      background: var(--amber);
      border-radius: 50%;
      pointer-events: none;
      z-index: 9999;
      transform: translate(-50%, -50%);
      transition: transform 0.1s, width 0.3s, height 0.3s, opacity 0.3s;
    }
    .cursor-ring {
      position: fixed;
      width: 32px;
      height: 32px;
      border: 1px solid rgba(196,132,26,0.5);
      border-radius: 50%;
      pointer-events: none;
      z-index: 9998;
      transform: translate(-50%, -50%);
      transition: transform 0.08s linear;
    }

    /* ── HERO ── */
    .hero {
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      background: var(--black);
      z-index: 2;
    }

    .hero-eyebrow {
      font-family: 'Montserrat', sans-serif;
      font-weight: 100;
      font-size: 0.6rem;
      letter-spacing: 0.55em;
      text-transform: uppercase;
      color: var(--amber);
      opacity: 0;
      margin-bottom: 2rem;
    }

    .hero-title {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 200;
      font-size: clamp(4rem, 10vw, 9rem);
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: var(--white);
      opacity: 0;
      line-height: 1;
    }

    .hero-rule {
      width: 1px;
      height: 0;
      background: var(--amber);
      margin: 2.5rem auto 0;
      opacity: 0;
    }

    .hero-sub {
      font-family: 'Montserrat', sans-serif;
      font-weight: 100;
      font-size: 0.58rem;
      letter-spacing: 0.5em;
      text-transform: uppercase;
      color: var(--ivory);
      opacity: 0;
      margin-top: 2rem;
    }

    .scroll-hint {
      position: absolute;
      bottom: 2.5rem;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.75rem;
      opacity: 0;
    }
    .scroll-hint span {
      font-size: 0.5rem;
      letter-spacing: 0.5em;
      text-transform: uppercase;
      color: var(--amber);
      font-weight: 100;
    }
    .scroll-line {
      width: 1px;
      height: 48px;
      background: linear-gradient(to bottom, var(--amber), transparent);
      animation: scrollPulse 2s ease-in-out infinite;
    }
    @keyframes scrollPulse {
      0%, 100% { opacity: 0.3; transform: scaleY(1); }
      50%       { opacity: 1;   transform: scaleY(1.3); }
    }

    /* ── VIDEO SCROLL SECTIONS ── */
    .video-scroll {
      position: relative;
      height: 350vh;
    }

    .video-sticky {
      position: sticky;
      top: 0;
      height: 100vh;
      overflow: hidden;
    }

    .video-sticky video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      will-change: transform;
    }

    /* gradient blends at section edges */
    .fade-bottom {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 35vh;
      pointer-events: none;
      z-index: 2;
    }

    .fade-top {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 30vh;
      pointer-events: none;
      z-index: 2;
    }

    #vs1 .fade-bottom {
      background: linear-gradient(to bottom, transparent, var(--amber));
    }
    #vs2 .fade-top {
      background: linear-gradient(to bottom, var(--amber), transparent);
    }
    #vs2 .fade-bottom {
      background: linear-gradient(to bottom, transparent, var(--black));
    }

    /* floating copy inside video sections */
    .video-label {
      position: absolute;
      bottom: 12vh;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      text-align: center;
      opacity: 0;
      pointer-events: none;
    }
    .video-label p {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 200;
      font-style: italic;
      font-size: clamp(1rem, 2.5vw, 1.6rem);
      letter-spacing: 0.12em;
      color: var(--white);
      white-space: nowrap;
    }

    /* ── AMBER BRIDGE ── */
    .bridge {
      position: relative;
      height: 100vh;
      background: var(--amber);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2;
    }

    .bridge-inner {
      text-align: center;
      opacity: 0;
      transform: translateY(24px);
    }

    .bridge-rule-top {
      width: 40px;
      height: 1px;
      background: rgba(8,8,8,0.35);
      margin: 0 auto 2.5rem;
    }

    .bridge-copy {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 200;
      font-style: italic;
      font-size: clamp(1.6rem, 4vw, 3rem);
      letter-spacing: 0.06em;
      color: var(--black);
      line-height: 1.4;
    }

    .bridge-rule-bottom {
      width: 40px;
      height: 1px;
      background: rgba(8,8,8,0.35);
      margin: 2.5rem auto 0;
    }

    /* ── CLOSING ── */
    .closing {
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--black);
      position: relative;
      z-index: 2;
      text-align: center;
    }

    .closing-title {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 200;
      font-size: clamp(2rem, 5vw, 4.5rem);
      letter-spacing: 0.2em;
      color: var(--white);
      opacity: 0;
      margin-bottom: 2.5rem;
    }

    .closing-cta {
      font-family: 'Montserrat', sans-serif;
      font-weight: 100;
      font-size: 0.58rem;
      letter-spacing: 0.6em;
      text-transform: uppercase;
      color: var(--amber);
      opacity: 0;
      position: relative;
      cursor: none;
      text-decoration: none;
    }
    .closing-cta::after {
      content: '';
      position: absolute;
      bottom: -4px;
      left: 0;
      width: 0;
      height: 1px;
      background: var(--amber);
      transition: width 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }
    .closing-cta:hover::after { width: 100%; }

    .closing-mark {
      position: absolute;
      bottom: 2.5rem;
      left: 50%;
      transform: translateX(-50%);
      font-family: 'Montserrat', sans-serif;
      font-weight: 100;
      font-size: 0.45rem;
      letter-spacing: 0.45em;
      text-transform: uppercase;
      color: rgba(237,232,223,0.25);
    }

    /* ── NAV ── */
    nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      padding: 2rem 3rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      mix-blend-mode: normal;
    }

    .nav-brand {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 200;
      font-size: 0.85rem;
      letter-spacing: 0.5em;
      text-transform: uppercase;
      color: var(--white);
      text-decoration: none;
      opacity: 0;
    }

    .nav-enquire {
      font-family: 'Montserrat', sans-serif;
      font-weight: 100;
      font-size: 0.5rem;
      letter-spacing: 0.5em;
      text-transform: uppercase;
      color: var(--amber);
      text-decoration: none;
      opacity: 0;
      cursor: none;
    }
  </style>
</head>
<body>

  <div class="cursor" id="cursor"></div>
  <div class="cursor-ring" id="cursorRing"></div>

  <!-- NAV -->
  <nav>
    <a href="#" class="nav-brand">Altus</a>
    <a href="#" class="nav-enquire">Enquire</a>
  </nav>

  <!-- HERO -->
  <section class="hero">
    <p class="hero-eyebrow">Private Aviation</p>
    <h1 class="hero-title">Altus</h1>
    <div class="hero-rule"></div>
    <p class="hero-sub">Above all else</p>
    <div class="scroll-hint">
      <span>Scroll</span>
      <div class="scroll-line"></div>
    </div>
  </section>

  <!-- VIDEO 1 — Engine -->
  <div class="video-scroll" id="vs1">
    <div class="video-sticky">
      <video id="video1" muted playsinline preload="auto" src="assets/video_engine.mp4"></video>
      <div class="fade-bottom"></div>
      <div class="video-label" id="label1">
        <p>Precision, engineered.</p>
      </div>
    </div>
  </div>

  <!-- AMBER BRIDGE -->
  <section class="bridge">
    <div class="bridge-inner" id="bridgeInner">
      <div class="bridge-rule-top"></div>
      <p class="bridge-copy">Every journey.<br>A ceremony.</p>
      <div class="bridge-rule-bottom"></div>
    </div>
  </section>

  <!-- VIDEO 2 — Meal -->
  <div class="video-scroll" id="vs2">
    <div class="video-sticky">
      <video id="video2" muted playsinline preload="auto" src="assets/video_meal.mp4"></video>
      <div class="fade-top"></div>
      <div class="fade-bottom"></div>
      <div class="video-label" id="label2">
        <p>Dining at altitude.</p>
      </div>
    </div>
  </div>

  <!-- CLOSING -->
  <section class="closing">
    <h2 class="closing-title">Reserve your altitude.</h2>
    <a href="#" class="closing-cta">Enquire now</a>
    <span class="closing-mark">Altus Private Aviation</span>
  </section>

  <!-- GSAP -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>

  <script>
    gsap.registerPlugin(ScrollTrigger);

    /* ── Cursor ── */
    const cursor = document.getElementById('cursor');
    const ring   = document.getElementById('cursorRing');
    let mx = 0, my = 0, rx = 0, ry = 0;

    document.addEventListener('mousemove', e => { mx = e.clientX; my = e.clientY; });

    (function animCursor() {
      rx += (mx - rx) * 0.12;
      ry += (my - ry) * 0.12;
      cursor.style.left = mx + 'px';
      cursor.style.top  = my + 'px';
      ring.style.left   = rx + 'px';
      ring.style.top    = ry + 'px';
      requestAnimationFrame(animCursor);
    })();

    /* ── Hero entrance ── */
    const heroTl = gsap.timeline({ defaults: { ease: 'power3.out' } });
    heroTl
      .to('.nav-brand',    { opacity: 1, duration: 1.4, delay: 0.3 })
      .to('.nav-enquire',  { opacity: 1, duration: 1.4 }, '<+0.2')
      .to('.hero-eyebrow', { opacity: 1, y: 0, duration: 1.4 }, '<+0.1')
      .fromTo('.hero-title', { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 1.8 }, '<+0.15')
      .to('.hero-rule',    { opacity: 1, height: 48, duration: 1.2, ease: 'power2.inOut' }, '<+0.3')
      .to('.hero-sub',     { opacity: 1, duration: 1.2 }, '<+0.2')
      .to('.scroll-hint',  { opacity: 1, duration: 1 }, '<+0.4');

    /* ── Video 1 scrub ── */
    const video1 = document.getElementById('video1');
    const video2 = document.getElementById('video2');

    function initVideo1() {
      gsap.to(video1, {
        currentTime: video1.duration,
        ease: 'none',
        scrollTrigger: {
          trigger: '#vs1',
          start: 'top top',
          end: 'bottom bottom',
          scrub: 2,
        }
      });

      gsap.fromTo(video1,
        { scale: 1 },
        {
          scale: 1.07,
          ease: 'none',
          scrollTrigger: {
            trigger: '#vs1',
            start: 'top top',
            end: 'bottom bottom',
            scrub: 2.5,
          }
        }
      );

      gsap.to('#label1', {
        opacity: 1,
        scrollTrigger: {
          trigger: '#vs1',
          start: '40% top',
          end: '60% top',
          scrub: 1,
        }
      });
    }

    /* ── Video 2 scrub ── */
    function initVideo2() {
      gsap.to(video2, {
        currentTime: video2.duration,
        ease: 'none',
        scrollTrigger: {
          trigger: '#vs2',
          start: 'top top',
          end: 'bottom bottom',
          scrub: 2,
        }
      });

      gsap.fromTo(video2,
        { scale: 1.04 },
        {
          scale: 1,
          ease: 'none',
          scrollTrigger: {
            trigger: '#vs2',
            start: 'top top',
            end: 'bottom bottom',
            scrub: 2.5,
          }
        }
      );

      gsap.to('#label2', {
        opacity: 1,
        scrollTrigger: {
          trigger: '#vs2',
          start: '40% top',
          end: '60% top',
          scrub: 1,
        }
      });
    }

    /* ── Load videos then init ── */
    if (video1.readyState >= 1) {
      initVideo1();
    } else {
      video1.addEventListener('loadedmetadata', initVideo1, { once: true });
    }

    if (video2.readyState >= 1) {
      initVideo2();
    } else {
      video2.addEventListener('loadedmetadata', initVideo2, { once: true });
    }

    /* ── Amber bridge reveal ── */
    gsap.to('#bridgeInner', {
      opacity: 1,
      y: 0,
      duration: 1.4,
      ease: 'power3.out',
      scrollTrigger: {
        trigger: '.bridge',
        start: 'top 65%',
        toggleActions: 'play none none reverse',
      }
    });

    /* ── Closing reveal ── */
    gsap.to('.closing-title', {
      opacity: 1,
      duration: 1.6,
      ease: 'power3.out',
      scrollTrigger: {
        trigger: '.closing',
        start: 'top 65%',
        toggleActions: 'play none none reverse',
      }
    });

    gsap.to('.closing-cta', {
      opacity: 1,
      duration: 1.4,
      delay: 0.3,
      ease: 'power3.out',
      scrollTrigger: {
        trigger: '.closing',
        start: 'top 65%',
        toggleActions: 'play none none reverse',
      }
    });

    /* ── Refresh on fonts loaded ── */
    document.fonts.ready.then(() => ScrollTrigger.refresh());
  </script>
</body>
</html>
