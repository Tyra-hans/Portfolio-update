        const bytes = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
        const b64 = u8 => btoa(String.fromCharCode(...u8));
        // the derived key is kept for this tab only, so a refresh doesn't ask again; a re-encrypted page (new salt) asks afresh
        const KEY = 'protected-page:' + P.salt;

        const decrypt = async key => new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: bytes(P.iv) }, key, bytes(P.data)));
        function show(html) { document.open(); document.write(html); document.close(); }
        async function keyFrom(password) {
            const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey']);
            return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: bytes(P.salt), iterations: P.iterations, hash: 'SHA-256' },
                base, { name: 'AES-GCM', length: 256 }, true, ['decrypt']);
        }

        try {
            const saved = sessionStorage.getItem(KEY);
            if (saved) crypto.subtle.importKey('raw', bytes(saved), 'AES-GCM', false, ['decrypt']).then(decrypt).then(show).catch(() => sessionStorage.removeItem(KEY));
        } catch (_) {}

        try { if (!sessionStorage.getItem(KEY)) track('protected_page_locked'); } catch (_) { track('protected_page_locked'); }
        const form = document.getElementById('lockForm'), input = document.getElementById('lockPassword');
        const button = document.getElementById('lockButton'), error = document.getElementById('lockError');
        form.addEventListener('submit', async e => {
            e.preventDefault();
            button.disabled = true; error.textContent = '';
            try {
                const key = await keyFrom(input.value);
                const html = await decrypt(key);   // throws on a wrong password
                try { sessionStorage.setItem(KEY, b64(new Uint8Array(await crypto.subtle.exportKey('raw', key)))); } catch (_) {}
                track('protected_page_unlocked');
                show(html);
            } catch (_) {
                button.disabled = false;
                track('protected_page_wrong_password');
                error.textContent = 'That password isn’t right.';
                form.classList.remove('shake'); void form.offsetWidth; form.classList.add('shake');
                input.select();
            }
        });
    })();
    </script>
</body>
</html>
